# The confirmatory campaign of v2 (review make-4658289, decision 5).
#
# Six confirmatory hypotheses, k = 6, tested with the predictable aGRAPA
# e-process at the familywise threshold 2k/alpha = 240. Every hypothesis is on
# beta, the retailer fill rate, at a declared effect of 0.05. The number of
# replicates comes from the simulated power of this exact procedure on a short
# pilot of the new engine, and the base seed is new: no cell is reused from the
# v1 campaign, which is now the pilot. Replicates, seed and design below are
# part of the seal (specs/v2/confirmatory_v2.seal.json); nothing here may
# change after sealing without a recorded amendment.
#
# The descriptor comparisons and the detector ablations of v1 are exploratory
# in v2 and are not listed here.
campaign: confirmatory_v2
alpha: 0.05
minimum_replicates: 30
# From the simulated power (specs/v2/power_v2.json): 357 replicates give power
# 0.80 for every hypothesis at the pilot's dispersion; 500 keep it if the true
# dispersion of H5 is at the upper end of the pilot's 95% interval (491).
replicates: 500
# New: distinct from the v1 campaign (20260703), the v2 pilot (20261105), the
# power simulation (20261106) and the detector null line (20261104).
base_seed: 20261107

arms:
  projection: configs/experiments/high_vol_shielded.yaml
  fallback: configs/experiments/high_vol_fallback_shield.yaml
  backup: configs/experiments/high_vol_backup_shield.yaml
  q_projection: configs/experiments/q_projection.yaml
  q_fallback: configs/experiments/q_fallback.yaml
  governed: configs/experiments/high_vol_governed_h2.yaml
  ungoverned: configs/experiments/high_vol_ungoverned.yaml
  five_projection: configs/experiments/five_shielded.yaml
  five_fallback: configs/experiments/five_fallback_shield.yaml

hypotheses:
  - id: H1
    question: >-
      With the fixed policy, does the projection shield attain a higher fill rate
      than the inadmissible null fallback (F-null)?
    indicator: operational.fill_rate
    treatment: projection
    control: fallback
    direction: greater
    predicted_effect: 0.05
    rationale: >-
      The central effect of v1, re-measured on the corrected engine. F-null
      replaces an inadmissible order by zero even when zero is itself
      inadmissible, so it can hold the chain in the unsafe region.

  - id: H2
    question: Does H1 hold with the Q-learning policy?
    indicator: operational.fill_rate
    treatment: q_projection
    control: q_fallback
    direction: greater
    predicted_effect: 0.05
    rationale: The same comparison with a learned policy in place of the fixed one.

  - id: H3
    question: >-
      Does the projection shield differ in fill rate from the admissible backup
      fallback (F-backup)?
    indicator: operational.fill_rate
    treatment: projection
    control: backup
    direction: different
    predicted_effect: 0.05
    rationale: >-
      Separates minimal correction from admissibility. Two-sided because either
      result decides the scenario: no difference means admissibility is what
      matters; a difference says which operator adds value.

  - id: H4
    question: >-
      Does mediation without a shield change the fill rate relative to no
      supervision, over the same horizon?
    indicator: operational.fill_rate
    treatment: governed
    control: ungoverned
    direction: different
    predicted_effect: 0.05
    rationale: >-
      RQ4 of v1, which compared 60 governed periods with 40 ungoverned ones.
      Both arms now run 60 periods. Two-sided: with the horizon corrected there
      is no defensible directional prediction.

  - id: H5
    question: Does H1 replicate on the five-echelon chain?
    indicator: operational.fill_rate
    treatment: five_projection
    control: five_fallback
    direction: greater
    predicted_effect: 0.05
    rationale: Topology invariance of the central effect.

  - id: H6
    question: Does H1 hold once the start-up periods are excluded?
    indicator: operational.fill_rate_after_startup
    treatment: projection
    control: fallback
    direction: greater
    predicted_effect: 0.05
    rationale: >-
      Beta over periods 27 to 59 only, after the detector's burn-in (12) and
      warm-up (15). Rules out an effect produced only by the start-up transient.

design:
  test:
    procedure: predictable aGRAPA e-process (Waudby-Smith and Ramdas, 2024)
    bet: lambda_t = clip(mu_{t-1} / (sigma2_{t-1} + mu_{t-1}^2), 0, 1/2)
    plug_ins: past differences only; prior mean 0, prior variance 1, weight one observation
    scale: 1.0
    scale_rationale: beta lies in [0, 1], so paired differences lie in [-1, 1]
    two_sided: average of the bets on d and on -d
    hypotheses: 6
    familywise_threshold: 240
    decision: reject at the first replicate whose e-value reaches 240
    pairing: arms share the replicate seed; differences are within the replicate
  effect: 0.05
  target_power: 0.80
  power:
    report: specs/v2/power_v2.json
    report_hash: 3b90a8b77f7f74f6d9aef4c2af8cc63d8f71eee4b250c16e34f2bc6dbdb63b42
    required_n_by_hypothesis: {H1: 249, H2: 251, H3: 281, H4: 275, H5: 357, H6: 286}
    binding_hypothesis: H5
    power_seed: 20261106
  pilot:
    report: specs/v2/pilot_v2.json
    report_hash: 6c77acc905367ea30c77b47557dea33a1f8877cdc86d9e452b4d14a57c3dd437
    base_seed: 20261105
    replicates: 30
    status: dispersion only; no pilot cell is reused
  seeds_not_to_reuse: [20260703, 20261104, 20261105, 20261106]
  startup_periods: 27
  envelope:
    claim: specification-derived operating approximation, not a PCTL guarantee
    bounds: {SAFE-1: 0.05, SAFE-2: 0.20, SAFE-3: 0.02}
    unit: replicate
    trial: violation at one (node, start) drawn uniformly with a seed derived from the replicate seed
    interval: Clopper-Pearson 95%
    also_reported: infeasible states (lower bound above upper bound)
  detector:
    coverage_error: realized flag rate minus 0.10
    martingale: no Ville bound claimed; false alarms measured on the null line
    null_line: configs/analysis/detector_null.yaml (200 stationary runs per detector, seed 20261104)
  exploratory:
    - the causal descriptor comparisons (v1 RQ3)
    - the detector ablations (v1 RQ6, RQ6b, RQ6c, RQ6d)
    - shield versus no shield (v1 RQ8)
  decision_rules:
    - when: H1 supported and H3 shows no difference
      claim: what matters is that substitution is admissible, not that it is minimal
      title: "Admissible Substitution, Not Projection…"
    - when: H1 supported and H3 favours projection
      claim: minimal correction adds value beyond admissibility
      title: kept
    - when: H1 supported and H3 favours the backup fallback
      claim: the general lesson is to avoid the inadmissible fallback
      title: reformulated
    - when: H1 not supported
      claim: the v1 effect was an artefact of the engine defects
      title: decided with the coauthors

exclusion_criteria:
  - runs whose decision log fails hash-chain verification
  - runs whose conformal detector reports saturation
  - runs that aborted before completing their declared horizon

notes: >-
  Arms share seeds by replicate, so every comparison is paired on the same
  demand path and disruption schedule, and each replicate carries its own seed,
  so the paired differences are i.i.d. across replicates.
