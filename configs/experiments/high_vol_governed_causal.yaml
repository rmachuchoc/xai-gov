# The causal-descriptor arm. Identical to high_vol_governed_h2 in every other
# respect, so whatever separates them is attributable to the descriptor alone.
_include_:
  - configs/network/three_echelon.yaml
  - configs/scenarios/high_volatility.yaml
  - configs/policies/opaque_dro.yaml
  - configs/governance/cpomdp_h2.yaml
  - configs/explainability/causal.yaml

# The recourse channel: an affordable, identifiable repair lowers the loss from
# not intervening, and by Theorem 2's monotonicity that raises the threshold.
# This is what makes RQ3 answerable at all — without it the descriptor is
# recorded and never consulted, so no descriptor arm can move the intervention
# rate.
governance:
  recourse_loss_relief: 0.4

experiment:
  name: high_vol_governed_causal
  periods: 60
  master_seed: 20260703
