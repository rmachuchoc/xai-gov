# Transfer test: an unannounced regime change the policy never calibrated
# on, plus a supply halt after it.
_include_:
  - configs/network/three_echelon.yaml
  - configs/scenarios/structural_change.yaml
  - configs/policies/opaque_dro.yaml
  - configs/governance/no_governance.yaml

experiment:
  name: structural_change_dro
  # The same horizon as the governed arms it is compared against: every
  # indicator is a sum or mean over periods, so unequal horizons are not a
  # paired comparison. The campaign runner refuses arms that differ.
  periods: 60
  master_seed: 20260703
