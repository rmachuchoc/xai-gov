# Interventional effects on the declared structural causal model, filtered to
# interventions that are admissible (worlds that can exist), identifiable
# (from what the agent observes) and affordable (within the recourse budget).
explainability:
  descriptor: causal
  params:
    fidelity_floor: 0.5
    recourse:
      budget: 30.0
      steps: [-20.0, -10.0, -5.0, 5.0, 10.0, 20.0]
      unit_costs:
        inventory: 1.0
        in_transit: 1.0
        capacity: 3.0
        data_delay: 5.0
